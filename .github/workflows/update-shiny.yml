name: Update shinyPossible.json

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-shiny
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate from Leek Duck
        run: python scripts/update_shiny.py

      - name: Commit changes
        run: |
          if git diff --quiet -- shinyPossible.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shinyPossible.json
          git commit -m "Update shinyPossible.json from Leek Duck"
          git push
